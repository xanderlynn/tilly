name: Release

# Pushing a tag like v0.2.0 (see scripts/release.mjs) runs CodeQL on the
# tagged code first; a serious finding stops the release. Then it builds the
# Windows portable ZIP into a draft GitHub Release, and adds checksums, the
# SBOM and the version's notes from CHANGELOG.md. Review the draft, then
# publish it. Releases are the portable ZIP only: no installers, no macOS
# build and no signed in-app update files (latest.json), so no updater key
# is needed. build.yml still builds installers on main for trying changes.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  build:
    name: Windows x64
    needs: codeql
    environment: release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the app version and has notes
        shell: bash
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > /dev/null
          for v in "$(node -p "require('./package.json').version")" \
                   "$(node -p "require('./src-tauri/tauri.conf.json').version")"; do
            if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $v; use npm run release"
              exit 1
            fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: release-windows-latest

      - name: Install frontend dependencies
        run: npm ci

      # The app on its own, without installers: all the portable ZIP needs.
      - name: Build Tilly.exe
        run: npm run tauri build -- --no-bundle

      - name: Package and upload the portable ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          node scripts/package-portable.mjs --platform windows --version "$version"
          gh release upload "$GITHUB_REF_NAME" "artifacts/Tilly_${version}_windows-x64-portable.zip" --clobber

  finish:
    name: Checksums and notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The software bill of materials: every shipped component with its
      # license (CycloneDX JSON plus a readable summary).
      - name: Generate the SBOM
        run: node scripts/sbom.mjs assets

      - name: Add the SBOM and SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          gh release download "$GITHUB_REF_NAME" --pattern '*.zip'
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.zip
            assets/tilly-sbom.cdx.json
            assets/tilly-licenses.md
            assets/SHA256SUMS.txt

      - name: Upload the SBOM and SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          gh release upload "$GITHUB_REF_NAME" tilly-sbom.cdx.json tilly-licenses.md SHA256SUMS.txt --clobber

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            # The hand-written notes for this version, from CHANGELOG.md.
            node scripts/changelog.mjs notes "$version"
            echo ""
            echo "## Download"
            echo ""
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows 10 and 11 (x64) | \`Tilly_${version}_windows-x64-portable.zip\` |"
            echo ""
            echo "Unzip it anywhere and run \`Tilly.exe\`. It needs no administrator rights and keeps its data in \`%APPDATA%\\com.xanderlynn.tilly\`, so your data carries over from earlier versions. It needs Microsoft's WebView2 runtime, which Windows 11 and up-to-date Windows 10 already have."
            echo ""
            echo "The build isn't code-signed, so Windows SmartScreen shows \"Windows protected your PC\" on first run: choose **More info › Run anyway**, or unblock the ZIP first (Properties › Unblock, or \`Unblock-File\` in PowerShell). Settings › Updates can't install it; download the ZIP instead."
            echo ""
            echo "Check the download with \`Get-FileHash Tilly_${version}_windows-x64-portable.zip\` against \`SHA256SUMS.txt\`. It was built by GitHub Actions from the tagged commit ([build run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)), with a signed build provenance attestation."
            echo ""
            echo "Every component that ships in Tilly, with its license, is listed in \`tilly-licenses.md\` and in the CycloneDX SBOM \`tilly-sbom.cdx.json\`. For what Tilly sends over the network and how to turn each part off, see [SECURITY.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/SECURITY.md#for-it-and-security-teams)."
            if [ -n "$prev" ]; then
              echo ""
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
